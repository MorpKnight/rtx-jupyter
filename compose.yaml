name: docker-jupyter

secrets:
  cloudflare_tunnel_token:
    file: "${CLOUDFLARE_TUNNEL_TOKEN_FILE:-./secrets/cloudflare-tunnel-token}"

services:
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    image: "${IMAGE_NAME:-giovan/jupyter-gpu:cu128}"
    container_name: docker-jupyter
    restart: unless-stopped
    user: root

    # Bind the published port only to the host's Tailscale IPv4 address.
    # Compose stops with a clear error when TAILSCALE_IP is not configured.
    ports:
      - "${TAILSCALE_IP:?Set TAILSCALE_IP in .env}:8888:8888"

    environment:
      # start.sh maps jovyan to the host UID/GID, fixes only mount roots, and
      # drops privileges before starting Jupyter. GRANT_SUDO is not enabled.
      NB_USER: jovyan
      NB_UID: "${NB_UID:-1000}"
      NB_GID: "${NB_GID:-1000}"
      CHOWN_HOME: "yes"
      CHOWN_EXTRA: /home/jovyan/work,/mnt/data,/home/jovyan/.codex

      JUPYTER_ENABLE_LAB: "yes"
      JUPYTER_TOKEN: "${JUPYTER_TOKEN:?Set JUPYTER_TOKEN in .env}"

      # Keep Hugging Face downloads and caches on the persistent host volume.
      HF_HOME: /mnt/data/.cache/huggingface
      HF_HUB_CACHE: /mnt/data/.cache/huggingface/hub
      TRANSFORMERS_CACHE: /mnt/data/.cache/huggingface/hub

      # Codex binary is in the image; account state is persisted separately.
      CODEX_HOME: /home/jovyan/.codex

    volumes:
      - type: bind
        source: "${WORKSPACE_ROOT:-./workspace}"
        target: /home/jovyan/work
        bind:
          create_host_path: false
      - type: bind
        source: "${DATA_ROOT:-./data}"
        target: /mnt/data
        bind:
          create_host_path: false
      - type: bind
        source: "${CODEX_ROOT:-./state/codex}"
        target: /home/jovyan/.codex
        bind:
          create_host_path: false

    working_dir: /home/jovyan/work

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu

  cloudflared:
    image: "${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}"
    container_name: cloudflared-jupyter
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/cloudflare_tunnel_token
    secrets:
      - cloudflare_tunnel_token
    depends_on:
      jupyter:
        condition: service_started

name: "${COMPOSE_PROJECT_NAME:-rtx-jupyter}"

services:
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    image: "${IMAGE_NAME:-ghcr.io/morpknight/rtx-jupyter:latest}"
    restart: unless-stopped
    user: root
    shm_size: "${SHM_SIZE:-2gb}"
    stop_grace_period: "${STOP_GRACE_PERIOD:-60s}"

    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"

    environment:
      # start.sh maps jovyan to the host UID/GID, fixes only mount roots, and
      # drops privileges before starting Jupyter. GRANT_SUDO is not enabled.
      NB_USER: jovyan
      NB_UID: "${NB_UID:-1000}"
      NB_GID: "${NB_GID:-1000}"
      CHOWN_HOME: "yes"
      CHOWN_EXTRA: /home/jovyan/work,/mnt/data,/home/jovyan/.codex

      JUPYTER_ENABLE_LAB: "yes"
      JUPYTER_TOKEN: "${JUPYTER_TOKEN:?Set JUPYTER_TOKEN in .env}"

      # Keep Hugging Face downloads and caches on the persistent host volume.
      HF_HOME: /mnt/data/.cache/huggingface
      HF_HUB_CACHE: /mnt/data/.cache/huggingface/hub
      TRANSFORMERS_CACHE: /mnt/data/.cache/huggingface/hub

      # Codex binary is in the image; account state is persisted separately.
      CODEX_HOME: /home/jovyan/.codex

    volumes:
      - type: bind
        source: "${WORKSPACE_ROOT:-./workspace}"
        target: /home/jovyan/work
        bind:
          create_host_path: false
      - type: bind
        source: "${DATA_ROOT:-./data}"
        target: /mnt/data
        bind:
          create_host_path: false
      - type: bind
        source: "${CODEX_ROOT:-./state/codex}"
        target: /home/jovyan/.codex
        bind:
          create_host_path: false

    working_dir: /home/jovyan/work

    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent --show-error http://127.0.0.1:8888/ >/dev/null
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

    deploy:
      resources:
        limits:
          pids: "${PIDS_LIMIT:-4096}"
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu

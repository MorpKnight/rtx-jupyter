name: Build, verify, and publish latest image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/morpknight/rtx-jupyter

concurrency:
  group: publish-image-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build candidate, verify, and promote
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Lint Dockerfile
        run: |
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            --workdir /workspace \
            --entrypoint hadolint \
            hadolint/hadolint:latest-debian \
            --config /workspace/.hadolint.yaml Dockerfile

      - name: Lint shell scripts
        run: |
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            --workdir /workspace \
            --entrypoint shellcheck \
            koalaman/shellcheck:stable \
            scripts/*.sh docker/05-prepare-jupyter-dirs \
            docker/10-seed-codex-config docker/codex-plan

      - name: Scan repository secrets
        run: |
          docker run --rm \
            --volume "$PWD:/repo:ro" \
            --entrypoint gitleaks \
            zricethezav/gitleaks:latest \
            detect --source=/repo --no-banner --redact

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define candidate reference
        run: echo "CANDIDATE_REF=${IMAGE_NAME}:build-${GITHUB_RUN_ID}" >>"${GITHUB_ENV}"

      - name: Generate OCI labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: type=raw,value=build-${{ github.run_id }}

      - name: Build and push unique candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          pull: true
          no-cache: true
          push: true
          tags: ghcr.io/morpknight/rtx-jupyter:build-${{ github.run_id }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Pull and test exact candidate
        run: |
          docker pull "${CANDIDATE_REF}"
          ./scripts/ci-smoke.sh "${CANDIDATE_REF}"

      - name: Record installed versions
        run: IMAGE_REF="${CANDIDATE_REF}" ./scripts/version-report.sh > version-report.txt

      - name: Generate vulnerability report
        run: |
          mkdir -p "${RUNNER_TEMP}/trivy-cache"
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "${RUNNER_TEMP}/trivy-cache:/root/.cache/trivy" \
            --volume "$PWD:/reports" \
            --entrypoint trivy \
            aquasec/trivy:latest image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --timeout 30m \
            --format json \
            --output /reports/trivy-report.json \
            "${CANDIDATE_REF}"

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rtx-jupyter-build-${{ github.run_id }}
          path: |
            version-report.txt
            trivy-report.json

      - name: Block fixable critical vulnerabilities
        run: |
          fixable_critical_count="$(
            jq '[
              .Results[]?.Vulnerabilities[]?
              | select(
                  .Severity == "CRITICAL"
                  and (.FixedVersion // "") != ""
                )
            ] | length' trivy-report.json
          )"
          if ((fixable_critical_count > 0)); then
            echo "Found ${fixable_critical_count} fixable CRITICAL vulnerabilities:" >&2
            jq -r '
              .Results[]? as $result
              | $result.Vulnerabilities[]?
              | select(
                  .Severity == "CRITICAL"
                  and (.FixedVersion // "") != ""
                )
              | [
                  $result.Target,
                  .VulnerabilityID,
                  .PkgName,
                  .InstalledVersion,
                  .FixedVersion
                ]
              | @tsv
            ' trivy-report.json >&2
            exit 1
          fi

      - name: Promote tested manifest
        run: |
          tags=(--tag "${IMAGE_NAME}:latest")
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tags+=(--tag "${IMAGE_NAME}:${GITHUB_REF_NAME}")
          fi
          docker buildx imagetools create "${tags[@]}" "${CANDIDATE_REF}"

      - name: Verify promoted digest
        run: |
          candidate_digest="$(docker buildx imagetools inspect "${CANDIDATE_REF}" | awk '$1 == "Digest:" {print $2; exit}')"
          latest_digest="$(docker buildx imagetools inspect "${IMAGE_NAME}:latest" | awk '$1 == "Digest:" {print $2; exit}')"
          test -n "${candidate_digest}"
          test "${candidate_digest}" = "${latest_digest}"
          printf 'Promoted digest: %s\n' "${latest_digest}"

name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint and secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Lint Dockerfile
        run: |
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            --workdir /workspace \
            hadolint/hadolint:latest-debian Dockerfile

      - name: Lint shell scripts
        run: |
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            --workdir /workspace \
            koalaman/shellcheck:stable \
            scripts/*.sh docker/05-prepare-jupyter-dirs \
            docker/10-seed-codex-config docker/codex-plan

      - name: Scan repository secrets
        run: |
          docker run --rm \
            --volume "$PWD:/repo:ro" \
            zricethezav/gitleaks:latest \
            detect --source=/repo --no-git --no-banner --redact

  image:
    name: Build and test latest dependencies
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build local CI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          pull: true
          no-cache: true
          push: false
          tags: rtx-jupyter:ci

      - name: Run Compose and runtime smoke tests
        run: ./scripts/ci-smoke.sh rtx-jupyter:ci

      - name: Record installed versions
        run: IMAGE_REF=rtx-jupyter:ci ./scripts/version-report.sh > version-report.txt

      - name: Generate vulnerability report
        run: |
          mkdir -p "${RUNNER_TEMP}/trivy-cache"
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "${RUNNER_TEMP}/trivy-cache:/root/.cache/trivy" \
            --volume "$PWD:/reports" \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --format json \
            --output /reports/trivy-report.json \
            rtx-jupyter:ci

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rtx-jupyter-ci-reports
          path: |
            version-report.txt
            trivy-report.json

      - name: Block fixable critical vulnerabilities
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "${RUNNER_TEMP}/trivy-cache:/root/.cache/trivy" \
            aquasec/trivy:latest image \
            --ignore-unfixed \
            --severity CRITICAL \
            --exit-code 1 \
            rtx-jupyter:ci
